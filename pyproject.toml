[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "lsr-retrieval"
version = "0.1.0"
description = "Local Spectral Retrieval: variance-aware neighbor selection via PCA in embedding neighborhoods"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Alison Cossette", email = "alison@claritrace.com"},
]
keywords = ["retrieval", "embeddings", "pca", "diversity", "rag", "vector-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7.0", "plotly>=5.0.0"]
notebook = ["marimo>=0.9.0", "plotly>=5.0.0"]
all = ["matplotlib>=3.7.0", "plotly>=5.0.0", "marimo>=0.9.0"]

[project.urls]
Repository = "https://github.com/acossette/lsr-research"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools]
package-dir = {"lsr" = "src"}
